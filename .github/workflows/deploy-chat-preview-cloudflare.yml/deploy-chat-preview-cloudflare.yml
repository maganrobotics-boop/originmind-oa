name: Release Chat preview to Cloudflare manually

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type exactly: originmind-public-chat-preview:preview.omindos.ai'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: chat-preview
      url: https://preview.omindos.ai
    concurrency:
      group: chat-cloudflare-preview
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.OA_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      OA_PRODUCTION_WORKER_NAME: ${{ vars.OA_PRODUCTION_WORKER_NAME }}
      CHAT_ADMIN_EMAIL: ${{ vars.CHAT_ADMIN_EMAIL || 'maganrobotics@gmail.com' }}
      PREVIEW_HOSTNAME: preview.omindos.ai
      PREVIEW_WORKER_NAME: originmind-public-chat-preview
      PREVIEW_DATABASE_NAME: origimind-public-chat-preview
      WRANGLER_SEND_METRICS: 'false'
      CI: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aeae4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: chat-cloudflare/package-lock.json
      - name: Install and validate the isolated Chat build
        run: |
          npm ci --prefix chat-cloudflare
          npm --prefix chat-cloudflare run check
      - name: Create the dedicated preview deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PUBLIC_LAB_AI_SERVICE_TOKEN: ${{ secrets.PUBLIC_LAB_AI_SERVICE_TOKEN }}
          CHAT_APP_ENCRYPTION_KEY: ${{ secrets.CHAT_APP_ENCRYPTION_KEY }}
          CHAT_RATE_LIMIT_HMAC_KEY: ${{ secrets.CHAT_RATE_LIMIT_HMAC_KEY }}
          CHAT_ADMIN_PASSWORD: ${{ secrets.CHAT_ADMIN_PASSWORD }}
        run: |
          test "${{ inputs.confirmation }}" = "originmind-public-chat-preview:preview.omindos.ai"
          node chat-cloudflare/scripts/deploy-preview-cloudflare.mjs
