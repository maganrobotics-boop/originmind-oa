name: Integrate and test OA member conversations
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: oa-member-conversations-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  integrate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/oa-member-conversations-20260918'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm run install:ci
      - name: Integrate the reviewed concurrent main changes
        run: |
          mkdir -p parity-validation
          node scripts/refine-oa-conversations.mjs
          node --input-type=module <<'JS'
          import { readFile, writeFile } from 'node:fs/promises';
          async function patch(file,before,after) {
            const source=await readFile(file,'utf8');
            if(source.includes(after))return;
            if(source.indexOf(before)<0 || source.indexOf(before)!==source.lastIndexOf(before))throw Error(`Ambiguous transition source: ${file}`);
            await writeFile(file,source.replace(before,after));
          }
          const context='components/knowledge/oa-conversation-context.tsx';
          await patch(context,'  const trigger = useRef<HTMLButtonElement>(null);',`  const trigger = useRef<HTMLButtonElement>(null);
            const [navigationPending, setNavigationPending] = useState(false);
            const afterMenuCloses = (action: () => void) => { pendingNavigation.current = action; setNavigationPending(true); };`);
          await patch(context,'<button ref={trigger} type="button"','<button ref={trigger} disabled={navigationPending} type="button"');
          await patch(context,'      pendingNavigation.current = null;','      pendingNavigation.current = null;\n      setNavigationPending(false);');
          await patch(context,'onSelect={() => { pendingNavigation.current = chat.chooseMember; }}','onSelect={() => afterMenuCloses(chat.chooseMember)}');
          await patch(context,'onSelect={() => { pendingNavigation.current = chat.showAi; }}','onSelect={() => afterMenuCloses(chat.showAi)}');
          await patch(context,'if (answer) pendingNavigation.current = () => chat.forward(answer);','if (answer) afterMenuCloses(() => chat.forward(answer));');
          const test='scripts/check-oa-member-chat-browser.mjs';
          await patch(test,"await alice.getByRole('menuitem',{name:'返回 AI 聊天'}).click();assert.ok", "await alice.getByRole('menuitem',{name:'返回 AI 聊天'}).click();await alice.locator('.oa-conversation-ai').waitFor({state:'visible'});await alice.locator('.oa-member-title').waitFor({state:'detached'});assert.ok");
          JS
      - name: Typecheck and lint
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee parity-validation/typecheck.log
          npm run lint 2>&1 | tee parity-validation/lint.log
      - name: Build and run the complete OA suite
        run: set -o pipefail; npm test 2>&1 | tee parity-validation/oa-tests.log
      - name: Build actual-page browser fixture
        run: node scripts/build-oa-chat-browser-fixture.mjs
      - name: Install isolated browser engine
        run: |
          npm install --prefix "$RUNNER_TEMP/oa-chat-browser" --no-save --ignore-scripts playwright@1.63.0
          node "$RUNNER_TEMP/oa-chat-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check all existing clear, focus, pending-answer and viewport regressions
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/oa-chat-browser/node_modules/playwright/index.mjs
        run: node scripts/check-oa-chat-browser.mjs
      - name: Check two-user forwarding and replies without production messages
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/oa-chat-browser/node_modules/playwright/index.mjs
        run: node scripts/check-oa-member-chat-browser.mjs
      - name: Commit validated source to the feature branch only
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$HEAD_BRANCH" = 'feat/oa-member-conversations-20260918'
          git add -- components/knowledge/oa-conversation-context.tsx components/knowledge/oa-chat-panel.tsx \
            scripts/check-oa-chat-browser.mjs scripts/check-oa-member-chat-browser.mjs
          if git diff --cached --quiet; then exit 0; fi
          authorization="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$authorization"
          current="$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" ls-remote origin "refs/heads/$HEAD_BRANCH" | cut -f1)"
          test "$current" = "$EXPECTED_HEAD" || { echo 'Branch changed. Reconcile before committing.'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(oa): preserve safe menu transitions and clear-chat regressions in member workspace'
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" push origin "HEAD:refs/heads/$HEAD_BRANCH"
      - name: Preserve private source and validation evidence
        if: always()
        run: |
          mkdir -p parity-validation/source
          git diff --binary HEAD > parity-validation/integration.patch
          git rev-parse HEAD > parity-validation/checkout-sha.txt
          git archive --format=tar HEAD -o parity-validation/checkout-source.tar
          for file in components/knowledge/oa-conversation-context.tsx components/knowledge/oa-chat-panel.tsx \
            scripts/check-oa-chat-browser.mjs scripts/check-oa-member-chat-browser.mjs; do
            cp --parents "$file" parity-validation/source/
          done
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oa-member-conversations-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: parity-validation/
          if-no-files-found: warn
          retention-days: 7
