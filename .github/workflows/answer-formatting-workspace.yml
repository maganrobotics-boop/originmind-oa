name: Chat answer formatting verification

on:
  push:
    branches: [fix/chat-answer-formatting-20260917]
    paths: [.github/workflows/answer-formatting-workspace.yml]

permissions:
  contents: write

jobs:
  verify:
    if: github.ref == 'refs/heads/fix/chat-answer-formatting-20260917'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - name: Apply checksum-verified source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib
          chunks = [pathlib.Path(f'.github/answer-formatting-part-{i}.b64').read_text().strip() for i in (1, 2, 3)]
          patch = lzma.decompress(base64.b64decode(''.join(chunks), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '8ce44b372ee6a6bc6afcf7b54627001bff0898913a264d3371e94e7ed4671a38'
          for line in patch.decode().splitlines():
              if line.startswith(('--- ', '+++ ')) and not line.endswith('/dev/null'):
                  assert line[4:].startswith(('a/chat-cloudflare/', 'b/chat-cloudflare/'))
                  assert '..' not in line[4:].split('/')
          pathlib.Path('/tmp/answer-formatting.patch').write_bytes(patch)
          PY
          git apply --check --whitespace=error /tmp/answer-formatting.patch
          git apply /tmp/answer-formatting.patch
      - name: Install locked dependencies
        run: npm ci --prefix chat-cloudflare
      - name: Build and run complete Chat tests
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix chat-cloudflare run build:frontend
          npm --prefix chat-cloudflare run check 2>&1 | tee answer-formatting-tests.log
          npm --prefix chat-cloudflare run check:wrangler 2>&1 | tee answer-formatting-dry-run.log
      - name: Install isolated browser test tools
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/answer-browser" --no-package-lock --ignore-scripts playwright@1.58.2
          node "$RUNNER_TEMP/answer-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify real desktop and mobile answer rendering
        shell: bash
        run: |
          set -euo pipefail
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/answer-browser/node_modules/playwright/index.mjs" node chat-cloudflare/scripts/check-answer-browser.mjs 2>&1 | tee answer-formatting-browser.log
      - name: Commit tested source and generated assets to feature branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "fix/chat-answer-formatting-20260917"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A chat-cloudflare
          git rm .github/answer-formatting-part-1.b64 .github/answer-formatting-part-2.b64 .github/answer-formatting-part-3.b64
          git commit -m "fix(chat): render formulas, improve answer typography and remove trailing inquiry"
          git push origin "HEAD:$GITHUB_REF_NAME"
          git rev-parse HEAD | tee answer-formatting-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: answer-formatting-verification
          path: |
            answer-formatting-*.log
            answer-formatting-commit.txt
            answer-browser-report
          retention-days: 7
          if-no-files-found: warn
