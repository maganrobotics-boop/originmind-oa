name: Prepare Chat Answer Focus 20260917
on:
  push:
    branches: [fix/chat-relevant-answer-20260917]
    paths:
      - .github/workflows/prepare-answer-focus-20260917.yml
      - chat-cloudflare/scripts/prepare-answer-focus-20260917.mjs
      - chat-cloudflare/test/answer-focus.test.mjs
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'maganrobotics-boop/originmind-oa' && github.ref == 'refs/heads/fix/chat-relevant-answer-20260917'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: chat-cloudflare/package-lock.json
      - name: Apply narrowly scoped source and test changes
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node chat-cloudflare/scripts/prepare-answer-focus-20260917.mjs
          git diff --stat
      - name: Install locked dependencies and run full Chat checks
        run: |
          npm ci --prefix chat-cloudflare
          npm --prefix chat-cloudflare run check
          npm --prefix chat-cloudflare run check:wrangler
      - name: Install isolated browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/answer-browser" --no-save --ignore-scripts playwright@1.63.0
          node "$RUNNER_TEMP/answer-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify current rendering, formulas, sharing and fallback screens
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/answer-browser/node_modules/playwright/index.mjs
          BROWSER_REPORT_DIR: ${{ runner.temp }}/answer-focus-browser-report
        run: |
          node chat-cloudflare/scripts/check-answer-browser.mjs
          node chat-cloudflare/scripts/check-message-actions-browser.mjs
          node chat-cloudflare/scripts/check-formula-runtime-browser.mjs
          node chat-cloudflare/scripts/check-answer-layout-browser.mjs
      - name: Commit verified application changes to this feature branch only
        run: |
          git add chat-cloudflare/src/app.mjs chat-cloudflare/src/knowledge.mjs chat-cloudflare/test/answer-presentation-integration.test.mjs chat-cloudflare/test/suggestions.test.mjs chat-cloudflare/scripts/check-answer-layout-browser.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(chat): prevent document dumps after failed synthesis and focus on the actual question'
          git push origin HEAD:refs/heads/fix/chat-relevant-answer-20260917
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: answer-focus-browser-${{ github.run_id }}
          path: ${{ runner.temp }}/answer-focus-browser-report
          if-no-files-found: ignore
          retention-days: 7
