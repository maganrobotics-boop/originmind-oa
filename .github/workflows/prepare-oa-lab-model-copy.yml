name: Prepare isolated OA laboratory copy edit

# Temporary authoring helper on this branch only; excluded from the final PR.
# No production environment, provider secret, dependency installation or deployment.
on:
  push:
    branches: ['codex/prepare-oa-lab-model-copy-20260919']
    paths: ['.github/workflows/prepare-oa-lab-model-copy.yml']

permissions:
  contents: write

jobs:
  prepare:
    if: github.repository == 'maganrobotics-boop/originmind-oa' && github.ref == 'refs/heads/codex/prepare-oa-lab-model-copy-20260919'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2
          persist-credentials: true
      - name: Apply exact reviewed text edits to the fixed source snapshot
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = cb4406a2598c4c742a71b392ef9fe8fb1f997543
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          expected = {
              'app/page.tsx': '0f4d2cf1f46484d69b4c72880c7f3d112db7060e',
              'components/knowledge/oa-chat-panel.tsx': 'f7d2beeb2c928646d0d2b2f7a9f3746e6d155f71',
              'components/knowledge/oa-chat-panel.css': '3aa96b99b7063dff5ecb605ac618263d29a6108e',
              'lib/oa-chat-documents.mjs': 'd4536df6a8b5a0352ec4474c05c330b0cdc5fbb8',
              'tests/oa-chat-documents.test.mjs': 'd502ab8825c7d7b942dff0b585bb15b20da35b57',
              'tests/oa-chat-menu.test.mjs': '6f015be8daaec3d677879d94f2f50db79201da11',
              'scripts/check-oa-chat-browser.mjs': '0083b6ce5049771485404653ffee0a4ce2d47b91',
              'scripts/check-oa-member-chat-browser.mjs': '774e6bd7124177be7fe34faa6ed415f886ee0a43',
              'scripts/check-oa-chat-documents-browser.mjs': '282ab28934cc2e78582508dfa40a93e399338d2d',
          }
          sources = {}
          for name, sha in expected.items():
              actual = subprocess.check_output(['git', 'hash-object', name], text=True).strip()
              if actual != sha:
                  raise SystemExit(f'Source snapshot changed: {name}')
              sources[name] = Path(name).read_bytes().decode('utf-8')

          def replace(name, old, new, count=1):
              if sources[name].count(old) != count:
                  raise SystemExit(f'Unexpected replacement count in {name}: {old!r}')
              sources[name] = sources[name].replace(old, new)

          replace('app/page.tsx', '<span>大模型与资料</span>', '<span>实验室大模型</span>')
          replace('app/page.tsx', 'aria-label="大模型后台"', 'aria-label="实验室大模型"')
          replace('app/page.tsx', 'tab: "ask", label: "AI 聊天"', 'tab: "ask", label: "AI 助手"')
          replace('components/knowledge/oa-chat-panel.tsx', 'aria-label="OA 实验室 AI 聊天"', 'aria-label="OA 实验室 AI 助手"')
          replace('components/knowledge/oa-chat-panel.tsx', '需要实验室大模型做什么？', '实验室大模型能做什么')
          replace('components/knowledge/oa-chat-panel.tsx', '知识问答、整理资料、生成文档，都在这里完成', '知识问答、资料整理、会议纪要、项目总结等')
          replace('components/knowledge/oa-chat-panel.tsx', "hint.label === '实验室知识问答'", "hint.label === '知识问答'")

          old_hints = """export const CHAT_DOCUMENT_HINTS = Object.freeze([
            { label: '整理资料 · 生成 Word', prompt: '请把材料整理成结构清晰的 Word 文档，保留关键事实。' },
            { label: '会议纪要 · 提取待办', prompt: '请整理成会议纪要，区分讨论、决定和待办，未明确的信息标注待补充。' },
            { label: '项目周报 · 编写方案', prompt: '请整理成项目周报，列出已完成、存在问题和下一步计划。' },
            { label: '实验室知识问答', prompt: '实验室有哪些研究方向？' },
          ]);"""
          new_hints = """export const CHAT_DOCUMENT_HINTS = Object.freeze([
            { label: '知识问答', prompt: '实验室有哪些研究方向？' },
            { label: '资料整理', prompt: '请把材料整理成结构清晰的 Word 文档，保留关键事实。' },
            { label: '会议纪要', prompt: '请整理成会议纪要，区分讨论、决定和待办，未明确的信息标注待补充。' },
            { label: '项目总结', prompt: '请把材料整理成项目总结文档，列出已完成工作、主要成果、存在问题和下一步计划，未明确的信息标注待补充。' },
          ]);"""
          replace('lib/oa-chat-documents.mjs', old_hints, new_hints)
          replace('components/knowledge/oa-chat-panel.css', '.oa-shared-chat .empty-hero p { margin:0;', '.oa-shared-chat .empty-hero h2, .oa-shared-chat .empty-hero p { max-width:100%; white-space:normal; overflow-wrap:anywhere; }\n.oa-shared-chat .empty-hero p { margin:0;')

          replace('tests/oa-chat-documents.test.mjs', '需要实验室大模型做什么？', '实验室大模型能做什么')
          replace('tests/oa-chat-documents.test.mjs', "  assert.equal(CHAT_DOCUMENT_HINTS.length, 4);\n  assert.ok(CHAT_DOCUMENT_HINTS.slice(0, 3).every(hint => wantsChatDocument(hint.prompt)));\n  assert.equal(wantsChatDocument(CHAT_DOCUMENT_HINTS[3].prompt), false);", "  assert.deepEqual(CHAT_DOCUMENT_HINTS.map(hint => hint.label), ['知识问答', '资料整理', '会议纪要', '项目总结']);\n  assert.equal(wantsChatDocument(CHAT_DOCUMENT_HINTS[0].prompt), false);\n  assert.ok(CHAT_DOCUMENT_HINTS.slice(1).every(hint => wantsChatDocument(hint.prompt)));\n  assert.equal(planChatDocument(CHAT_DOCUMENT_HINTS[2].prompt).kind, 'meeting_minutes');\n  assert.equal(planChatDocument(CHAT_DOCUMENT_HINTS[3].prompt).kind, 'document');\n  assert.match(CHAT_DOCUMENT_HINTS[3].prompt, /项目总结文档/u);")
          sources['tests/oa-chat-documents.test.mjs'] += """
          test('laboratory welcome uses approved copy and preserves ordinary-question source reset', async () => {
            const source = await readFile(new URL('../components/knowledge/oa-chat-panel.tsx', import.meta.url), 'utf8');
            assert.ok(source.includes('>实验室大模型能做什么</h2>'));
            assert.ok(source.includes('<p>知识问答、资料整理、会议纪要、项目总结等</p>'));
            assert.ok(source.includes("hint.label === '知识问答') documents.useSource(null)"));
            assert.doesNotMatch(source, /需要实验室大模型做什么[？?]|整理资料 · 生成 Word|项目周报 · 编写方案/u);
          });
          """
          replace('tests/oa-chat-menu.test.mjs', 'tab: "ask", label: "AI 聊天"', 'tab: "ask", label: "AI 助手"')
          sources['tests/oa-chat-menu.test.mjs'] += """
          test('sidebar uses laboratory model and AI assistant names without changing destinations', async () => {
            const page = await read('app/page.tsx');
            assert.ok(page.includes('<span>实验室大模型</span>'));
            assert.ok(page.includes('aria-label="实验室大模型"'));
            assert.doesNotMatch(page, /大模型与资料|label: "AI 聊天"/u);
            assert.ok(page.includes('if (tab === "ask") conversation.showAi(); onKnowledgeTab(tab);'));
          });
          """

          replace('scripts/check-oa-member-chat-browser.mjs', '需要实验室大模型做什么？', '实验室大模型能做什么')
          replace('scripts/check-oa-chat-browser.mjs', "name:'AI 聊天',exact:true", "name:'AI 助手',exact:true")
          replace('scripts/check-oa-chat-browser.mjs', "      assert.doesNotMatch(await nav.innerText(), /官网 OEM 申请|流程与规则/u);", "      assert.doesNotMatch(await nav.innerText(), /官网 OEM 申请|流程与规则|大模型与资料|AI 聊天/u);\n      assert.equal(await nav.locator('[data-sidebar-section=\"knowledge\"]').innerText(), '实验室大模型');\n      assert.equal(await nav.getByRole('navigation', {name:'实验室大模型',exact:true}).count(), 1);\n      assert.equal(await nav.getByRole('button', {name:'AI 助手',exact:true}).isVisible(), true);")
          replace('scripts/check-oa-chat-documents-browser.mjs', '需要实验室大模型做什么？', '实验室大模型能做什么')
          replace('scripts/check-oa-chat-documents-browser.mjs', "['mobile',390,844],['landscape',844,390]", "['mobile',390,844],['mobile-small',320,700],['landscape',844,390]")
          replace('scripts/check-oa-chat-documents-browser.mjs', "      assert.equal(await page.getByRole('heading',{name:'实验室大模型能做什么',exact:true}).isVisible(),true);", """      assert.equal(await page.getByRole('heading',{name:'实验室大模型能做什么',exact:true}).isVisible(),true);
                assert.equal(await page.locator('.empty-hero p').innerText(),'知识问答、资料整理、会议纪要、项目总结等');
                assert.equal(await page.locator('.empty-hero p').isVisible(),true);
                assert.ok(await page.locator('.empty-hero').evaluate(element => [...element.querySelectorAll('h2,p')].every(child => child.scrollWidth <= child.clientWidth + 1)));
                const hints = page.locator('.oa-chat-examples button');
                assert.deepEqual(await hints.allTextContents(),['知识问答','资料整理','会议纪要','项目总结']);
                if (height > 520) {
                  const prompts = [
                    '实验室有哪些研究方向？',
                    '请把材料整理成结构清晰的 Word 文档，保留关键事实。',
                    '请整理成会议纪要，区分讨论、决定和待办，未明确的信息标注待补充。',
                    '请把材料整理成项目总结文档，列出已完成工作、主要成果、存在问题和下一步计划，未明确的信息标注待补充。',
                  ];
                  for (let index = 0; index < prompts.length; index++) {
                    await hints.nth(index).click();
                    assert.equal(await input.inputValue(),prompts[index]);
                  }
                  assert.equal(createRequests().length,0,'choosing a capability must not submit a task');
                  assert.equal(requests.filter(item => item.path === '/api/lab-ai/ask' && item.method === 'POST').length,0,'choosing a capability must not call the model');
                  await input.fill('');
                }""")
          replace('scripts/check-oa-chat-documents-browser.mjs', 'ordinaryChat:true,rawImport:true', 'approvedCopy:true,capabilityHints:true,ordinaryChat:true,rawImport:true')

          # All guards pass before any file is changed. No API or release file is touched.
          for name, source in sources.items():
              Path(name).write_bytes(source.encode('utf-8'))
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          if set(changed) != set(expected):
              raise SystemExit('Unexpected changed-file set')
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'add', '--', *expected], check=True)
          print('Prepared exactly nine OA presentation and test files.')
          PY
      - name: Commit only to the isolated authoring branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/prepare-oa-lab-model-copy-20260919
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(oa): align laboratory model labels and capability hints'
          git push origin HEAD:refs/heads/codex/prepare-oa-lab-model-copy-20260919
