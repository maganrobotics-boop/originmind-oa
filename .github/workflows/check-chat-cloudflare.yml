name: Check Chat Cloudflare

on:
  pull_request:
    paths:
      - 'chat-cloudflare/**'
      - '.github/workflows/check-chat-cloudflare.yml'
      - '.github/workflows/deploy-chat-cloudflare.yml'
      - '.github/workflows/initialize-chat-admin.yml'
  push:
    branches:
      - main
    paths:
      - 'chat-cloudflare/**'
      - '.github/workflows/check-chat-cloudflare.yml'
      - '.github/workflows/deploy-chat-cloudflare.yml'
      - '.github/workflows/initialize-chat-admin.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: chat-cloudflare/package-lock.json
      - name: Install locked dependencies
        run: npm ci --prefix chat-cloudflare
      - name: Check Worker, assets, release gates, and tests
        run: |
          npm --prefix chat-cloudflare run check
          npm --prefix chat-cloudflare run check:wrangler
