name: Prepare Chat message actions branch
on:
  push:
    branches: ['feat/chat-message-actions-20260917']
    paths:
      - '.github/workflows/prepare-chat-message-actions.yml'
      - 'chat-cloudflare/frontend/message-actions.js'
      - 'chat-cloudflare/frontend/message-actions.css'
      - 'chat-cloudflare/test/message-actions.test.mjs'
      - 'chat-cloudflare/scripts/check-message-actions-browser.mjs'
      - 'chat-cloudflare/scripts/prepare-message-actions.mjs'
      - 'chat-cloudflare/scripts/update-message-action-tests.mjs'
permissions:
  contents: write
concurrency:
  group: prepare-chat-message-actions-20260917
  cancel-in-progress: false
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/chat-message-actions-20260917
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Apply inspected frontend integration
        run: |
          node chat-cloudflare/scripts/prepare-message-actions.mjs
          node chat-cloudflare/scripts/update-message-action-tests.mjs
      - name: Install locked dependencies and rebuild
        run: |
          npm ci --prefix chat-cloudflare
          npm --prefix chat-cloudflare run build:frontend
      - name: Check source, generated assets and regression suite
        run: npm --prefix chat-cloudflare run check
      - name: Install isolated browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/message-browser" --no-save --ignore-scripts playwright@1.63.0
          node "$RUNNER_TEMP/message-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify desktop, mobile, sharing, editing and existing formula behavior
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/message-browser/node_modules/playwright/index.mjs
          BROWSER_REPORT_DIR: ${{ runner.temp }}/message-browser-report
        run: |
          node chat-cloudflare/scripts/check-message-actions-browser.mjs
          node chat-cloudflare/scripts/check-answer-browser.mjs
          node chat-cloudflare/scripts/check-formula-runtime-browser.mjs
      - name: Commit only this feature and rebuilt release inputs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chat-cloudflare/frontend chat-cloudflare/scripts/build-frontend.mjs chat-cloudflare/scripts/check-message-actions-browser.mjs chat-cloudflare/test chat-cloudflare/package.json chat-cloudflare/public .github/workflows/check-chat-cloudflare.yml
          if ! git diff --cached --quiet; then
            git commit -m 'feat(chat): add answer actions, public source label and question editing'
            git push origin HEAD:feat/chat-message-actions-20260917
          fi
      - name: Preserve branch verification files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chat-message-actions-${{ github.run_id }}
          path: |
            chat-cloudflare/frontend
            chat-cloudflare/public
            chat-cloudflare/scripts
            chat-cloudflare/test
            ${{ runner.temp }}/message-browser-report
          retention-days: 14
