name: Check OA AI workbench

on:
  push:
    branches: ['feat/oa-ai-workbench-20260918']
  pull_request:
    branches: [main]
    paths:
      - 'lib/ai-workbench*'
      - 'lib/oa-chat-client.ts'
      - 'app/ai-workbench/**'
      - 'app/api/lab-ai/tasks/**'
      - 'chat-cloudflare/src/oa-chat-bridge.mjs'
      - 'worker/index.ts'
      - 'migrations/oa/**'
      - 'tests/ai-workbench*'
      - '.github/workflows/check-ai-workbench.yml'

permissions:
  contents: read

concurrency:
  group: ai-workbench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm run install:ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build and test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/ai-workbench-tests.log"
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai-workbench-tests-${{ github.sha }}
          path: ${{ runner.temp }}/ai-workbench-tests.log
          if-no-files-found: warn
          retention-days: 7
