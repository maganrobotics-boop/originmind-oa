name: Integrate and validate OA Chat parity

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: oa-chat-parity-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  integrate-and-test:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/oa-chat-parity-20260917'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            chat-cloudflare/package-lock.json
      - name: Install locked dependencies (no production credentials)
        run: |
          npm run install:ci
          npm --prefix chat-cloudflare ci
      - name: Materialize exact source integration and shared rendering assets
        run: |
          mkdir -p parity-validation
          node scripts/apply-oa-chat-parity.mjs
          node scripts/sync-oa-chat-shared.mjs
          node --check lib/oa-chat-renderer.mjs
          node --check chat-cloudflare/src/grounded-prompt.mjs
      - name: Check OA types
        run: set -o pipefail; npm run typecheck 2>&1 | tee parity-validation/typecheck.log
      - name: Lint OA
        run: set -o pipefail; npm run lint 2>&1 | tee parity-validation/lint.log
      - name: Build and test OA including private bridge regression tests
        run: set -o pipefail; npm test 2>&1 | tee parity-validation/oa-tests.log
      - name: Check the public Chat frontend and full Chat regression suite
        run: set -o pipefail; npm --prefix chat-cloudflare run check 2>&1 | tee parity-validation/chat-tests.log
      - name: Commit only the validated integration sources to this feature branch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$HEAD_BRANCH" = 'feat/oa-chat-parity-20260917'
          git add -- app/page.tsx app/oa-workspace.css components/knowledge/knowledge-view.tsx \
            'app/api/knowledge/[id]/assets/[...assetPath]/route.ts' \
            chat-cloudflare/src/app.mjs chat-cloudflare/src/grounded-prompt.mjs \
            lib/oa-chat-renderer.mjs lib/oa-chat-renderer.d.mts \
            components/knowledge/shared-chat.generated.css \
            tests/lab-ai-ask-timing.test.mjs tests/ui-components.test.mjs \
            public/assets/oa-chat-LICENSES.md public/assets/katex-*.mjs
          if git diff --cached --quiet; then
            echo 'Integration already committed; checks completed without source changes.'
            exit 0
          fi
          authorization="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$authorization"
          current="$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" ls-remote origin "refs/heads/$HEAD_BRANCH" | cut -f1)"
          test "$current" = "$EXPECTED_HEAD" || { echo 'Feature branch moved; reconcile before committing.'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(oa): materialize validated shared Chat workspace and collapsible navigation'
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" push origin "HEAD:refs/heads/$HEAD_BRANCH"
      - name: Preserve validation logs and integrated sources for review
        if: always()
        run: |
          mkdir -p parity-validation/source
          git diff --no-ext-diff --binary HEAD > parity-validation/uncommitted.patch
          git status --short > parity-validation/git-status.txt
          git rev-parse HEAD > parity-validation/checkout-sha.txt
          for file in app/page.tsx app/oa-workspace.css \
            components/knowledge/knowledge-view.tsx components/knowledge/shared-chat.generated.css \
            chat-cloudflare/src/app.mjs chat-cloudflare/src/grounded-prompt.mjs \
            lib/oa-chat-renderer.mjs lib/oa-chat-renderer.d.mts \
            tests/lab-ai-ask-timing.test.mjs tests/ui-components.test.mjs; do
            if test -f "$file"; then cp --parents "$file" parity-validation/source/; fi
          done
      - name: Upload private validation evidence (not a deployment)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oa-chat-parity-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: parity-validation/
          if-no-files-found: warn
          retention-days: 7
