name: Check OA and release production manually

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type the exact Worker:D1-UUID:hostname confirmation from the production environment'
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked OA dependencies
        run: npm run install:ci
      - name: Check OA types
        run: npm run typecheck
      - name: Lint OA
        run: npm run lint
      - name: Build and test OA
        run: npm test

  reject-invalid-production-dispatch:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Reject a non-main production dispatch
        run: exit 64

  deploy:
    needs: test
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: production-oa
      url: ${{ vars.OA_PRODUCTION_PUBLIC_ORIGIN }}
    concurrency:
      group: oa-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.OA_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      OA_PRODUCTION_CLOUDFLARE_ACCOUNT_ID: ${{ vars.OA_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      OA_PRODUCTION_WORKER_NAME: ${{ vars.OA_PRODUCTION_WORKER_NAME }}
      OA_PRODUCTION_D1_DATABASE_NAME: ${{ vars.OA_PRODUCTION_D1_DATABASE_NAME }}
      OA_PRODUCTION_D1_DATABASE_ID: ${{ vars.OA_PRODUCTION_D1_DATABASE_ID }}
      OA_PRODUCTION_WEBSITE_D1_DATABASE_NAME: ${{ vars.OA_PRODUCTION_WEBSITE_D1_DATABASE_NAME }}
      OA_PRODUCTION_WEBSITE_D1_DATABASE_ID: ${{ vars.OA_PRODUCTION_WEBSITE_D1_DATABASE_ID }}
      OA_PRODUCTION_PUBLIC_ORIGIN: ${{ vars.OA_PRODUCTION_PUBLIC_ORIGIN }}
      OA_PRODUCTION_CRON: ${{ vars.OA_PRODUCTION_CRON }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked OA dependencies
        run: npm run install:ci
      - name: Release the authorized OA production target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OA_PRODUCTION_RELEASE_CONFIRM: ${{ inputs.confirmation }}
        run: npm run release:standalone:production
      - name: Preserve immutable release and recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oa-production-${{ github.sha }}-${{ github.run_attempt }}
          path: .wrangler/releases/production-*
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
