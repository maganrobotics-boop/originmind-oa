name: Verify Chat image and long-answer repair 20260917

on:
  push:
    branches: [fix/knowledge-image-e2e-20260917]
    paths: [.github/workflows/fix-chat-long-answers-20260917.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-chat-image-answer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/fix/knowledge-image-e2e-20260917'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout isolated repair branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            chat-cloudflare/package-lock.json

      - name: Verify exact source patch and apply without changing production
        shell: python
        run: |
          import base64, gzip, hashlib, subprocess
          from pathlib import Path
          parts = [Path(f'.github/repairs/chat-image-answer-20260917.part{i}').read_text().strip() for i in (1, 2, 3)]
          for i, part in enumerate(parts, 1):
              print(f'part {i}: {len(part)} characters, sha256 {hashlib.sha256(part.encode()).hexdigest()}')
          # Correct the identified two-character transport duplication, then
          # require the entire decoded patch to match the locally tested digest.
          encoded = ''.join(parts).replace('QIWbPwzOTwdwd2G', 'QIWbPwzOTwd2G')
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          expected = '6ea29c1f3b8db9a14fe271900a512ce754cea9996fd78f60d4d678d03b3d514e'
          actual = hashlib.sha256(patch).hexdigest()
          if actual != expected:
              raise SystemExit(f'Patch integrity failure: {actual}')
          target = Path('/tmp/chat-image-answer-repair.patch')
          target.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(target)], check=True)
          subprocess.run(['git', 'apply', str(target)], check=True)
          print(f'Applied verified source patch: {actual}')

      - name: Build frontend and run all Chat tests
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix chat-cloudflare
          npm --prefix chat-cloudflare run build:frontend
          npm --prefix chat-cloudflare run check
          npm --prefix chat-cloudflare run check:wrangler

      - name: Install locked OA dependencies
        run: npm run install:ci

      - name: Check OA types
        run: npm run typecheck

      - name: Lint OA
        run: npm run lint

      - name: Build and test OA
        run: npm test

      - name: Commit only verified source and remove one-shot transport
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'fix/knowledge-image-e2e-20260917'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/public/lab-ai lib/knowledge-store.ts lib/public-knowledge-assets.mjs chat-cloudflare/src chat-cloudflare/test chat-cloudflare/frontend chat-cloudflare/public docs/chat-image-answer-repair-20260917.md
          git rm .github/repairs/chat-image-answer-20260917.part1 .github/repairs/chat-image-answer-20260917.part2 .github/repairs/chat-image-answer-20260917.part3 .github/workflows/fix-chat-long-answers-20260917.yml
          git diff --cached --check
          git commit -m "fix(chat): restore approved knowledge images and complete long answers"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "Verified source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'No merge or production deployment was performed.' >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare private source snapshot including changes under test
        if: always()
        shell: python
        run: |
          import subprocess, tarfile
          from pathlib import Path
          names = subprocess.check_output(['git','ls-files','-z','--cached','--others','--exclude-standard']).decode().split('\0')
          with tarfile.open('source-under-test.tar','w') as archive:
              for name in sorted(set(names)):
                  if name and name != 'source-under-test.tar' and Path(name).is_file():
                      archive.add(name, arcname=name, recursive=False)

      - name: Retain private source snapshot for follow-up verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chat-repair-source
          path: source-under-test.tar
          retention-days: 1
          if-no-files-found: error
