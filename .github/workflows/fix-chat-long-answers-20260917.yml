name: Fix Chat long answers 20260917

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: chat-cloudflare/package-lock.json

      - name: Install locked dependencies
        run: npm ci --prefix chat-cloudflare

      - name: Patch answer budget and prompt
        shell: python
        run: |
          from pathlib import Path

          app = Path("chat-cloudflare/src/app.mjs")
          text = app.read_text(encoding="utf-8")
          replacements = [
            (
              "async function modelCall(context, config, messages, maxTokens = 700, timeoutMs = 20_000)",
              "async function modelCall(context, config, messages, maxTokens = 2_400, timeoutMs = 60_000)",
            ),
            (
              "async function workersAiCall(context, messages, maxTokens = 700)",
              "async function workersAiCall(context, messages, maxTokens = 2_400)",
            ),
            (
              "默认使用自然、简洁、专业、温和的中文；用户使用其他语言或明确要求时，改用相应语言。先给结论，再补充必要依据或下一步；通常使用两到四个短段落，只有并列信息较多时才用简短列表。",
              "默认使用自然、专业、完整的中文；用户使用其他语言或明确要求时，改用相应语言。先回答核心问题，再充分补充必要依据、技术细节、例子或下一步。简单问题可以简短；科研、机器人、论文、项目和技术问题应以回答完整为优先，不要为了控制篇幅省略关键内容，也不要在句子或论证尚未完成时停止。并列信息较多时可使用列表。",
            ),
            (
              "其他回答优先短段落。不要输出 HTML、图片或装饰性标题。",
              "其他回答优先清晰段落；复杂问题允许较长回答。不要输出 HTML、图片或装饰性标题。",
            ),
          ]
          for old, new in replacements:
            if old not in text:
              raise SystemExit(f"Expected app.mjs fragment not found: {old[:160]}")
            text = text.replace(old, new, 1)
          app.write_text(text, encoding="utf-8")

          test = Path("chat-cloudflare/test/worker.test.mjs")
          t = test.read_text(encoding="utf-8")
          t = t.replace(
            'modelCall\\(context, config, messages, maxTokens = 700, timeoutMs = 20_000\\)',
            'modelCall\\(context, config, messages, maxTokens = 2_400, timeoutMs = 60_000\\)',
          )
          t = t.replace(
            'workersAiCall\\(context, messages, maxTokens = 700\\)',
            'workersAiCall\\(context, messages, maxTokens = 2_400\\)',
          )
          t = t.replace('defaults cap response length and Bailian wait time', 'defaults allow complete answers and sufficient Bailian wait time')
          test.write_text(t, encoding="utf-8")

      - name: Run full Chat checks
        run: npm --prefix chat-cloudflare run check

      - name: Verify long-answer contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'maxTokens = 2_400, timeoutMs = 60_000' chat-cloudflare/src/app.mjs
          grep -F 'workersAiCall(context, messages, maxTokens = 2_400)' chat-cloudflare/src/app.mjs
          grep -F '科研、机器人、论文、项目和技术问题应以回答完整为优先' chat-cloudflare/src/app.mjs

      - name: Commit verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chat-cloudflare/src/app.mjs chat-cloudflare/test/worker.test.mjs
          if git diff --cached --quiet; then
            echo "Long-answer repair is already current."
            exit 0
          fi
          git commit -m "fix(chat): allow complete long-form answers"
          git push origin "HEAD:${GITHUB_REF_NAME}"
