name: Integrate current formula fix with answer presentation
on:
  push:
    branches: [fix/answer-content-cleanup-20260917]
    paths: ['.github/workflows/integrate-chat-answer-presentation.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/answer-content-cleanup-20260917
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: chat-cloudflare/package-lock.json
      - name: Merge the exact reviewed main revision without dropping source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin 1ba0b9709cced56f825f6cb6f6d1c52ec58d7aca
          set +e
          git merge --no-commit --no-ff 1ba0b9709cced56f825f6cb6f6d1c52ec58d7aca
          result=$?
          set -e
          if [ "$result" -ne 0 ]; then
            conflicts=$(git diff --name-only --diff-filter=U)
            if [ -z "$conflicts" ]; then exit "$result"; fi
            while IFS= read -r path; do
              case "$path" in
                chat-cloudflare/public/index.html|chat-cloudflare/public/assets/*) ;;
                *) echo "Unresolved authored-source conflict: $path"; exit 1 ;;
              esac
            done <<< "$conflicts"
          fi
          # These are deterministic build outputs. All authored source merges
          # must already be clean before regenerating them from both changes.
          git restore --source=HEAD --staged --worktree chat-cloudflare/public/index.html chat-cloudflare/public/assets
      - name: Install dependencies and verify integrated source
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix chat-cloudflare
          npm --prefix chat-cloudflare run build:frontend
          npm --prefix chat-cloudflare run check 2>&1 | tee /tmp/integrated-answer-tests.txt
          npm --prefix chat-cloudflare run check:wrangler
      - name: Commit only a verified integration
        shell: bash
        run: |
          set -euo pipefail
          git add chat-cloudflare/public/index.html chat-cloudflare/public/assets
          test -z "$(git diff --name-only --diff-filter=U)"
          git commit -m 'Merge current main formula fixes into answer presentation cleanup'
          git push origin HEAD:fix/answer-content-cleanup-20260917
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integrated-answer-tests-${{ github.run_id }}
          path: /tmp/integrated-answer-tests.txt
          if-no-files-found: warn
          retention-days: 7
