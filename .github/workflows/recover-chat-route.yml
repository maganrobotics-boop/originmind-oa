name: Recover Chat production route
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    environment: production-oa
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ vars.OA_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      CHAT_HOST: chat.omindos.ai
      CHAT_WORKER: originmind-public-chat-production
    steps:
      - name: Diagnose and restore the Chat Worker route
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          (async () => {
            const token = process.env.CF_API_TOKEN;
            const accountId = process.env.CF_ACCOUNT_ID;
            const host = process.env.CHAT_HOST;
            const worker = process.env.CHAT_WORKER;
            const expectedOrigin = '43.138.161.143';
            const conflictingSitesTarget = 'custom-domains.chatgpt.site';
            const headers = { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' };
            const report = [];
            const call = async (label, url, options = {}) => {
              const response = await fetch(url, { headers, ...options });
              let body = {};
              try { body = await response.json(); } catch {}
              report.push(label + ': HTTP ' + response.status + (body.errors ? ' — ' + body.errors.map((e) => e.code + ' ' + e.message).join('; ') : ''));
              return { response, body };
            };
            try {
              const zone = await call('Zone lookup', 'https://api.cloudflare.com/client/v4/zones?name=omindos.ai');
              if (!zone.response.ok || !zone.body.success || !zone.body.result.length) throw new Error('Zone lookup failed');
              const zoneId = zone.body.result[0].id;
              const dns = await call('DNS lookup', 'https://api.cloudflare.com/client/v4/zones/' + zoneId + '/dns_records?name=' + encodeURIComponent(host));
              if (!dns.response.ok || !dns.body.success) throw new Error('DNS lookup failed');
              for (const record of dns.body.result) {
                report.push('DNS record: ' + JSON.stringify({ id: record.id, type: record.type, name: record.name, content: record.content, ttl: record.ttl, proxied: record.proxied }));
              }
              if (dns.body.result.length !== 1) throw new Error('Expected exactly one Chat DNS record');
              const dnsRecord = dns.body.result[0];
              const dnsIsReady = dnsRecord.type === 'A' && dnsRecord.content === expectedOrigin && dnsRecord.proxied === true;
              const dnsIsKnownConflict = dnsRecord.type === 'CNAME' && dnsRecord.content === conflictingSitesTarget && dnsRecord.proxied === false;
              if (!dnsIsReady && !dnsIsKnownConflict) throw new Error('Chat DNS record is neither the saved origin nor the known Sites conflict');
              if (dnsIsKnownConflict) {
                const restored = await call('DNS restore', 'https://api.cloudflare.com/client/v4/zones/' + zoneId + '/dns_records/' + dnsRecord.id, {
                  method: 'PUT',
                  body: JSON.stringify({ type: 'A', name: host, content: expectedOrigin, ttl: 1, proxied: true }),
                });
                if (!restored.response.ok || !restored.body.success) throw new Error('DNS restore failed');
                const saved = restored.body.result;
                if (saved.type !== 'A' || saved.name !== host || saved.content !== expectedOrigin || saved.proxied !== true) {
                  throw new Error('DNS restore did not preserve the saved Chat origin');
                }
                report.push('DNS restored to the saved proxied Chat origin.');
              }
              const api = 'https://api.cloudflare.com/client/v4/zones/' + zoneId + '/workers/routes';
              const listed = await call('Route list', api);
              if (!listed.response.ok || !listed.body.success) throw new Error('Route list failed');
              for (const item of listed.body.result.filter((candidate) => candidate.pattern.includes(host))) {
                report.push('Matching route: ' + JSON.stringify({ id: item.id, pattern: item.pattern, script: item.script }));
              }
              const domains = await call('Worker domain list', 'https://api.cloudflare.com/client/v4/accounts/' + accountId + '/workers/domains?hostname=' + encodeURIComponent(host));
              if (!domains.response.ok || !domains.body.success) throw new Error('Worker domain list failed');
              for (const domain of domains.body.result) {
                report.push('Worker domain: ' + JSON.stringify({ id: domain.id, hostname: domain.hostname, service: domain.service, environment: domain.environment, zone_id: domain.zone_id }));
              }
              const pattern = host + '/*';
              const route = listed.body.result.find((item) => item.pattern === pattern);
              const changed = route
                ? await call('Route update', api + '/' + route.id, { method: 'PUT', body: JSON.stringify({ pattern, script: worker }) })
                : await call('Route create', api, { method: 'POST', body: JSON.stringify({ pattern, script: worker }) });
              if (!changed.response.ok || !changed.body.success) throw new Error('Route write failed');
              report.push('Result: Chat Worker route restored.');
            } catch (error) {
              report.push('Result: ' + error.message);
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## Chat route recovery\n\n' + report.map((line) => '- ' + line).join('\n') + '\n');
            console.log(report.join('\n'));
            if (!report.includes('Result: Chat Worker route restored.')) process.exit(1);
          })();
          NODE
