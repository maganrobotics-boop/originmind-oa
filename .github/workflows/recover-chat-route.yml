name: Recover Chat production route

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    environment: production-oa
    env:
      CF_ACCOUNT_ID: ${{ vars.OA_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CHAT_HOST: chat.omindos.ai
      CHAT_WORKER: arts-robotics-chat-production
    steps:
      - name: Restore the Chat Worker route without DNS mutation
        shell: bash
        run: |
          node <<'NODE'
          const account = process.env.CF_ACCOUNT_ID;
          const token = process.env.CF_API_TOKEN;
          const host = process.env.CHAT_HOST;
          const worker = process.env.CHAT_WORKER;
          if (!account || !token) throw new Error('Missing Cloudflare production credentials');
          const api = 'https://api.cloudflare.com/client/v4/accounts/' + account + '/workers/routes';
          const headers = { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' };
          const listed = await fetch(api, { headers });
          const routes = await listed.json();
          if (!listed.ok || !routes.success) throw new Error('Cannot list Worker routes: HTTP ' + listed.status);
          const pattern = host + '/*';
          const route = routes.result.find((item) => item.pattern === pattern);
          if (route) {
            const changed = await fetch(api + '/' + route.id, { method: 'PUT', headers, body: JSON.stringify({ pattern, script: worker }) });
            if (!changed.ok) throw new Error('Cannot update Chat route: HTTP ' + changed.status);
          } else {
            const sibling = routes.result.find((item) => item.zone_id && /(^|\\.)omindos\\.ai\\/\\*$/u.test(item.pattern));
            if (!sibling) throw new Error('No omindos.ai Worker route is available to recover the zone binding');
            const created = await fetch(api, { method: 'POST', headers, body: JSON.stringify({ pattern, script: worker, zone_id: sibling.zone_id }) });
            if (!created.ok) throw new Error('Cannot create Chat route: HTTP ' + created.status);
          }
          console.log('Chat Worker route restored.');
          NODE
