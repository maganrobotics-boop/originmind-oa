name: Recover Chat production route
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    environment: production-oa
    env:
      CF_ACCOUNT_ID: ${{ vars.OA_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CHAT_HOST: chat.omindos.ai
      CHAT_WORKER: arts-robotics-chat-production
    steps:
      - name: Restore the Chat Worker route without DNS mutation
        shell: bash
        run: |
          node <<'NODE'
          (async () => {
            const account = process.env.CF_ACCOUNT_ID;
            const token = process.env.CF_API_TOKEN;
            const host = process.env.CHAT_HOST;
            const worker = process.env.CHAT_WORKER;
            if (!account || !token) throw new Error('Missing Cloudflare production credentials');
            const headers = { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' };
            const zoneResponse = await fetch('https://api.cloudflare.com/client/v4/zones?name=omindos.ai', { headers });
            const zonePayload = await zoneResponse.json();
            if (!zoneResponse.ok || !zonePayload.success || !zonePayload.result.length) throw new Error('Cannot resolve omindos.ai zone: HTTP ' + zoneResponse.status);
            const api = 'https://api.cloudflare.com/client/v4/accounts/' + account + '/workers/routes';
            const listed = await fetch(api, { headers });
            const routes = await listed.json();
            if (!listed.ok || !routes.success) throw new Error('Cannot list Worker routes: HTTP ' + listed.status);
            const pattern = host + '/*';
            const route = routes.result.find((item) => item.pattern === pattern);
            const changed = route
              ? await fetch(api + '/' + route.id, { method: 'PUT', headers, body: JSON.stringify({ pattern, script: worker }) })
              : await fetch(api, { method: 'POST', headers, body: JSON.stringify({ pattern, script: worker, zone_id: zonePayload.result[0].id }) });
            if (!changed.ok) throw new Error('Cannot apply Chat route: HTTP ' + changed.status);
            console.log('Chat Worker route restored.');
          })().catch((error) => { console.error(error.stack || error.message); process.exit(1); });
          NODE
