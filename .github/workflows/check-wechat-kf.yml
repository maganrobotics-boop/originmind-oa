name: Check WeChat customer-service bridge

on:
  pull_request:
    paths:
      - 'integrations/wechat-kf/**'
      - '.github/workflows/check-wechat-kf.yml'
  push:
    branches: [main]
    paths:
      - 'integrations/wechat-kf/**'
      - '.github/workflows/check-wechat-kf.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Verify standalone bridge
        run: node --test integrations/wechat-kf/tests/*.test.mjs
