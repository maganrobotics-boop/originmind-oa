name: Release Chat static assets manually

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type exactly: originmind-public-chat-production:static-assets:chat.omindos.ai'
        required: true
        type: string

permissions:
  contents: read

jobs:
  reject-invalid-ref:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Reject a non-main static production dispatch
        run: exit 64

  release-static:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production-oa
      url: https://chat.omindos.ai
    concurrency:
      group: chat-cloudflare-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.OA_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      OA_PRODUCTION_WORKER_NAME: ${{ vars.OA_PRODUCTION_WORKER_NAME }}
      CHAT_ADMIN_EMAIL: ${{ vars.CHAT_ADMIN_EMAIL || 'maganrobotics@gmail.com' }}
      CHAT_STATIC_RELEASE_CONFIRM: ${{ inputs.confirmation }}
      CHAT_RELEASE_ID: ${{ github.sha }}-${{ github.run_attempt }}
      PUBLIC_ALLOWED_ORIGINS: https://maganrobotics-boop.github.io
      WRANGLER_SEND_METRICS: 'false'
      CI: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: chat-cloudflare/package-lock.json
      - name: Install locked Chat dependencies
        run: npm ci --prefix chat-cloudflare
      - name: Check the Chat frontend and static release target
        run: |
          npm --prefix chat-cloudflare run check:frontend
          node --test chat-cloudflare/test/public-assets.test.mjs chat-cloudflare/test/document-extraction.test.mjs
      - name: Release Chat static assets without touching OA token, DNS, secrets, or migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node chat-cloudflare/scripts/release-static-cloudflare.mjs
      - name: Preserve non-secret static release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chat-static-cloudflare-${{ github.sha }}-${{ github.run_attempt }}
          path: chat-cloudflare/.wrangler/static-releases/*/evidence
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
