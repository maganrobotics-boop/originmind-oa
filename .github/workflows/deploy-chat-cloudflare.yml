name: Release Chat to Cloudflare manually

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type exactly: originmind-public-chat-production:originmind-public-chat-production:chat.omindos.ai'
        required: true
        type: string

permissions:
  contents: read

jobs:
  reject-invalid-ref:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Reject a non-main production dispatch
        run: exit 64

  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: production-oa
      url: https://chat.omindos.ai
    concurrency:
      group: chat-cloudflare-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.OA_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      OA_PRODUCTION_WORKER_NAME: ${{ vars.OA_PRODUCTION_WORKER_NAME }}
      CHAT_ADMIN_EMAIL: ${{ vars.CHAT_ADMIN_EMAIL || 'maganrobotics@gmail.com' }}
      CHAT_EXPECTED_ORIGIN_IPV4: ${{ vars.CHAT_EXPECTED_ORIGIN_IPV4 }}
      CHAT_WORKERS_DEV_SUBDOMAIN: ${{ vars.CHAT_WORKERS_DEV_SUBDOMAIN }}
      CHAT_RELEASE_CONFIRM: ${{ inputs.confirmation }}
      CHAT_RELEASE_ID: ${{ github.sha }}-${{ github.run_attempt }}
      WRANGLER_SEND_METRICS: 'false'
      CI: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: chat-cloudflare/package-lock.json
      - name: Install locked Chat dependencies
        run: npm ci --prefix chat-cloudflare
      - name: Check the Chat Worker and release controls
        run: |
          npm --prefix chat-cloudflare run check
          node --test chat-cloudflare/scripts/*.test.mjs
      - name: Stage, verify, and release Chat
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PUBLIC_LAB_AI_SERVICE_TOKEN: ${{ secrets.PUBLIC_LAB_AI_SERVICE_TOKEN }}
          CHAT_APP_ENCRYPTION_KEY: ${{ secrets.CHAT_APP_ENCRYPTION_KEY }}
          CHAT_RATE_LIMIT_HMAC_KEY: ${{ secrets.CHAT_RATE_LIMIT_HMAC_KEY }}
          CHAT_ADMIN_PASSWORD: ${{ secrets.CHAT_ADMIN_PASSWORD }}
        run: node chat-cloudflare/scripts/release-cloudflare.mjs
      - name: Preserve non-secret release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chat-cloudflare-${{ github.sha }}-${{ github.run_attempt }}
          path: chat-cloudflare/.wrangler/releases/*/evidence
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30

  verify-formula-rendering:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/formula-browser" --no-save --ignore-scripts playwright@1.63.0
          node "$RUNNER_TEMP/formula-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify deployed formula assets in a browser without production writes
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/formula-browser/node_modules/playwright/index.mjs
          BROWSER_REPORT_DIR: ${{ runner.temp }}/formula-production-report
          ANSWER_BROWSER_ORIGIN: https://chat.omindos.ai
        run: node chat-cloudflare/scripts/check-formula-runtime-browser.mjs
      - name: Preserve deployed formula verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chat-formula-production-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/formula-production-report
          if-no-files-found: warn
          retention-days: 30
