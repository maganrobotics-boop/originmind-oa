name: Check OA attachment lifecycle

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/api/lab-ai/**'
      - 'components/knowledge/**'
      - 'lib/**'
      - 'migrations/oa/**'
      - 'worker/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/check-chat-file-lifecycle.yml'

permissions:
  contents: read

concurrency:
  group: oa-attachment-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Verify existing document planning baseline
        run: node --test tests/oa-chat-documents.test.mjs
      - name: Isolate tracked source for offline verification
        run: git archive --format=tar.gz -o "$RUNNER_TEMP/oa-verification-source.tar.gz" HEAD
      - name: Preserve private verification snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oa-verification-source-${{ github.run_id }}
          path: ${{ runner.temp }}/oa-verification-source.tar.gz
          retention-days: 1
          if-no-files-found: error
