name: Check OA attachment lifecycle

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/api/lab-ai/**'
      - 'components/knowledge/**'
      - 'lib/**'
      - 'migrations/oa/**'
      - 'worker/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/check-chat-file-lifecycle.yml'

permissions:
  contents: read

concurrency:
  group: oa-attachment-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Verify document, archive, cleanup and upload security contracts
        run: node --test tests/oa-chat-documents.test.mjs tests/oa-chat-attachments.test.mjs tests/oa-chat-file-lifecycle.test.mjs tests/oa-workbench-release.test.mjs tests/ai-workbench-api.test.mjs
