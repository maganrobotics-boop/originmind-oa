name: Apply reviewed AI workbench source
on:
  push:
    branches: ['feat/oa-ai-workbench-20260918']
    paths: ['.openai/ai-workbench-review.patch.b64']
permissions:
  contents: write
jobs:
  apply-and-check:
    if: github.repository == 'maganrobotics-boop/originmind-oa' && github.ref == 'refs/heads/feat/oa-ai-workbench-20260918'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Apply exact reviewed patch without touching main or production
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          payload = pathlib.Path('.openai/ai-workbench-review.patch.b64')
          patch = lzma.decompress(base64.b64decode(payload.read_text().strip(), validate=True))
          assert len(patch) < 200000
          assert hashlib.sha256(patch).hexdigest() == 'a6eff222076db89122a333fe4a5f4b4e4113f2d7f04e631b7b0cbd643ead7aee'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          PY
          git rm .openai/ai-workbench-review.patch.b64
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: add private OA AI workbench and Feishu document tasks'
          git push origin HEAD:refs/heads/feat/oa-ai-workbench-20260918
          git rev-parse HEAD > "$RUNNER_TEMP/workbench-result-sha.txt"
          git config --local --unset-all http.https://github.com/.extraheader || true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm run install:ci
      - name: Typecheck lint build and test reviewed source
        shell: bash
        run: |
          set -o pipefail
          { npm run typecheck && npm run lint && npm test; } 2>&1 | tee "$RUNNER_TEMP/workbench-ci.log"
      - name: Preserve exact source-check evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai-workbench-apply-check-${{ github.sha }}
          path: |
            ${{ runner.temp }}/workbench-ci.log
            ${{ runner.temp }}/workbench-result-sha.txt
          if-no-files-found: warn
          retention-days: 3
