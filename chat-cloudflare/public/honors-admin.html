<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>荣誉管理 · OriginMind</title>
  <link rel="stylesheet" href="/learning/honors.css">
  <script type="module" src="/learning/honors-admin.mjs"></script>
</head>
<body class="honors-page honors-admin">
  <header class="honors-topbar"><a class="honors-brand" href="/learning/honors">OriginMind <span>× ARTS Robotics</span></a><div class="honors-actions"><a href="/learning/honors">公开荣誉墙</a><button id="honors-logout" type="button" class="honors-button secondary" hidden>退出管理</button></div></header>
  <main class="honors-main">
    <section id="honors-login" class="honors-login">
      <h1>荣誉管理</h1><p class="honors-subtle">请使用现有 Chat 管理员账户登录。</p>
      <form id="honors-login-form" class="honors-form"><label>管理员密码<input name="password" type="password" autocomplete="current-password" required></label><button type="submit" class="honors-button">登录</button><p id="honors-login-status" class="honors-status" role="status"></p></form>
    </section>
    <section id="honors-admin-app" hidden>
      <p class="honors-kicker">RECOGNITION &amp; RECORDS</p><h1>荣誉管理</h1><p class="honors-subtle">补录新手村通关、毕业纪念、竞赛获奖和项目贡献。事实与账户均须人工核对。</p>
      <form id="honors-grant-form" class="honors-form">
        <h2>授予或补录荣誉</h2>
        <div class="honors-form-row"><label>获奖人姓名<input name="name" maxlength="80" required></label><label>荣誉类别<select name="category"><option value="newbie">新手村通关</option><option value="alumni">毕业纪念</option><option value="competition">竞赛获奖</option><option value="contribution">项目贡献</option><option value="other">其他荣誉</option></select></label></div>
        <label>荣誉名称<input name="title" maxlength="100" placeholder="例如：新手村通关 · 机器人探索者" required></label>
        <label>公开事迹说明<textarea name="message" maxlength="600" placeholder="只填写可公开的成果与贡献。"></textarea></label>
        <div class="honors-form-row"><label>事迹日期（未知可留空）<input name="achievementDate" type="date"></label><label>展示范围<select name="visibility"><option value="public">公开展示</option><option value="hidden">仅本人可见</option></select></label></div>
        <label>确认方式<select name="sourceKind"><option value="manual_confirmation">人工确认</option><option value="reference">可追溯来源</option></select></label>
        <label>确认依据（仅管理员可见）<textarea name="sourceReference" maxlength="1200" placeholder="填写确认人及依据，或证书、项目记录、归档材料的准确出处。" required></textarea></label>
        <fieldset class="honors-account-picker"><legend>关联个人账户（可选）</legend><p class="honors-subtle">无账户的历届学生可先留在荣誉墙。搜索结果只供核对，不会自动绑定。</p><div class="honors-search"><label>查询姓名或邮箱<input name="recipientSearch" maxlength="254"></label><button type="button" class="honors-button secondary" data-search>查询账户</button></div><label>选择已核对的账户<select name="recipientEmail"><option value="">暂不绑定账户</option></select></label><p class="honors-status" data-search-status role="status"></p><label>账户核验说明<textarea name="bindingNote" maxlength="600" placeholder="绑定时填写核验依据，例如已核对签署记录与学生身份。"></textarea></label></fieldset>
        <label class="honors-check"><input name="confirmed" type="checkbox" required><span>我已核对荣誉事实与来源；如关联账户，已确认该账户属于获奖人。</span></label>
        <div class="honors-actions"><button type="submit" class="honors-button">确认授予</button><p id="honors-grant-status" class="honors-status" role="status"></p></div>
      </form>
      <div class="honors-toolbar"><label>记录状态<select id="honors-admin-filter"><option value="all">全部记录</option><option value="unbound">待绑定账户</option><option value="public">公开展示</option><option value="hidden">仅本人可见</option><option value="revoked">已撤回</option></select></label><button id="honors-admin-refresh" type="button" class="honors-button secondary">刷新记录</button></div>
      <p id="honors-admin-status" class="honors-status" role="status"></p><div id="honors-admin-list" class="honors-grid"></div><button id="honors-admin-more" class="honors-button secondary" type="button" hidden>查看更多</button>
    </section>
  </main>
  <dialog id="honors-action-dialog" aria-labelledby="honors-action-title">
    <h2 id="honors-action-title"></h2><p id="honors-action-person"></p><p id="honors-action-explanation" class="honors-subtle"></p>
    <form id="honors-action-form">
      <fieldset id="honors-bind-fields" class="honors-account-picker" hidden><legend>核对个人账户</legend><div class="honors-search"><label>查询姓名或邮箱<input name="recipientSearch" maxlength="254"></label><button type="button" class="honors-button secondary" data-search>查询账户</button></div><label>选择已核对的账户<select name="recipientEmail"><option value="">请选择准确的账户</option></select></label><p class="honors-status" data-search-status role="status"></p><label class="honors-check"><input name="confirmed" type="checkbox"><span>我已人工确认该账户属于此获奖人。</span></label></fieldset>
      <label>操作说明（仅管理员可见）<textarea name="note" maxlength="1200" required></textarea></label><p id="honors-action-status" class="honors-status" role="status"></p><div class="honors-actions"><button type="submit" class="honors-button">确认操作</button><button type="button" class="honors-button secondary" data-close="honors-action-dialog">取消</button></div>
    </form>
  </dialog>
  <dialog id="honors-audit-dialog" aria-labelledby="honors-audit-title"><h2 id="honors-audit-title">授予与操作记录</h2><div id="honors-audit-list"></div><p id="honors-audit-status" class="honors-status" role="status"></p><button type="button" class="honors-button secondary" data-close="honors-audit-dialog">关闭</button></dialog>
  <footer class="honors-footer">© 2026 OriginMind. All rights reserved.</footer>
</body>
</html>
