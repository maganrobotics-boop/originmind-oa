<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>荣誉墙 · OriginMind × ARTS Robotics</title>
  <link rel="stylesheet" href="/learning/honors.css">
  <script type="module" src="/learning/honors.mjs"></script>
</head>
<body class="honors-page">
  <header class="honors-topbar"><a class="honors-brand" href="/newbie-village">OriginMind <span>× ARTS Robotics</span></a><a href="/newbie-village">返回课程</a></header>
  <main class="honors-main">
    <section class="honors-intro">
      <div><p class="honors-kicker">OUR PEOPLE, THEIR ACHIEVEMENTS</p><h1>荣誉墙</h1><p class="honors-lead">记录认真完成的学习、值得纪念的成果，和对团队作出的贡献。</p><p class="honors-subtle">每份荣誉均经人工确认；历届同学的成果也可在这里留存。</p></div>
      <img class="honors-hero-trophy" src="/learning/honors-trophy.svg" alt="" width="144" height="144">

    <div class="honors-toolbar">
      <label>荣誉类别<select id="honors-category"><option value="">全部荣誉</option><option value="newbie">新手村通关</option><option value="alumni">毕业纪念</option><option value="competition">竞赛获奖</option><option value="contribution">项目贡献</option><option value="other">其他荣誉</option></select></label>
      <button id="honors-refresh" type="button" class="honors-button secondary">刷新</button>
    </div>
    <p id="honors-status" class="honors-status" role="status">正在读取荣誉…</p>
    <section id="honors-list" class="honors-grid" aria-label="公开荣誉记录"></section>
    <button id="honors-more" type="button" class="honors-button secondary" hidden>查看更多</button>

  <footer class="honors-footer"><a href="/learning/honors/admin">荣誉管理</a><span>© 2026 OriginMind. All rights reserved.</span></footer>
