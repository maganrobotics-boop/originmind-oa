# Include only inside the existing chat.omindos.cn server block.
# The health endpoint stays on loopback. Callback query strings contain encrypted
# content and signature values, so they are intentionally excluded from logs.
location = /integrations/wechat-kf/callback {
    if ($scheme = http) { return 308 https://$host$request_uri; }
    access_log off;
    client_max_body_size 64k;
    client_body_timeout 10s;
    proxy_pass http://127.0.0.1:3014;
    proxy_http_version 1.1;
    proxy_set_header Host chat.omindos.cn;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host chat.omindos.cn;
    proxy_set_header Connection "";
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_buffering off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
}
